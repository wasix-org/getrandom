# Allow normal use of "cargo run" and "cargo test" on these wasm32 platforms.
[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'
[target.wasm64-unknown-unknown]
runner = 'wasm-bindgen-test-runner'
[target.wasm32-wasip1]
runner = 'wasmtime'
[target.wasm32-wasip2]
runner = 'wasmtime'
[target.wasm32-wasip3]
runner = 'wasmtime'

# Just run on node by default (that's where emscripten is tested)
[target.'cfg(target_os = "emscripten")']
runner = 'node'

[resolver]
incompatible-rust-versions = "allow"

# Resolve crates through the WASIX overlay registry: WASIX-specific
# forks come from the registry, everything else from crates.io.
[source.crates-io]
replace-with = "wasix"

[source.wasix]
registry = "sparse+https://cargo-registry.wasix.org/"
